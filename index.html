<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="N픽 | 필요한 순간, 알아두면 좋은 선택. 일상에 필요한 다양한 정보와 유용한 혜택을 모았어요.">
<title>N픽 | 필요한 순간, 알아두면 좋은 선택</title>
<style>
:root{--ink:#172b45;--muted:#75849a;--line:#e8edf4;--blue:#eaf4ff;--page:#fff;--shadow:0 5px 18px rgba(30,55,90,.045)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f8fafc;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}.page{width:min(100%,540px);min-height:100vh;margin:0 auto;padding:14px 15px 22px;background:var(--page);box-shadow:0 0 36px rgba(31,55,83,.035)}
.disclosure{display:flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:8px 12px;border:1px solid #e5effb;border-radius:999px;background:#f0f6fd;color:#586d87;font-size:10px;line-height:1.5;text-align:center;animation:softPulse 4.8s ease-in-out infinite}
.disclosure svg{width:15px;height:15px;flex:none;color:#5e7897}@keyframes softPulse{0%,100%{background:#f0f6fd}50%{background:#e8f2fc}}
.profile{display:flex;align-items:center;gap:12px;padding:17px 2px 15px}.avatar{width:62px;height:62px;border-radius:50%;object-fit:cover;border:1px solid #e8edf3;flex:none}.identity{min-width:0;flex:1}.brand{font-size:22px;font-weight:850;letter-spacing:-.8px;line-height:1.2}.tagline{margin-top:5px;font-size:12px;color:#697b91;letter-spacing:-.25px}.share{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:48px;padding:5px 3px;border:0;background:transparent;color:#61758d;cursor:pointer;font:inherit}.share-icon{display:grid;place-items:center;width:36px;height:36px;border:1px solid #e8edf4;border-radius:50%;background:#fbfcfe}.share svg{width:18px;height:18px}.share small{font-size:9px}
.search{display:flex;align-items:center;gap:9px;height:42px;padding:0 13px;border:1px solid #e4ebf5;border-radius:999px;background:#fbfcff;box-shadow:var(--shadow)}.search svg{width:17px;height:17px;color:#8293a9;flex:none}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:12px}.search input::placeholder{color:#9aa8bb}.section-title{display:flex;align-items:center;gap:8px;margin:21px 2px 10px;font-size:16px;font-weight:800;letter-spacing:-.45px}.leaf{width:16px;height:16px;color:#55bea0}
.cards{display:grid;gap:10px}.card{--tint:#f0f7ff;--accent:#5fa8fa;display:flex;align-items:center;gap:11px;min-height:96px;padding:8px;border-radius:15px;background:var(--tint);transition:transform .18s ease,box-shadow .18s ease}.card:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(31,55,83,.07)}.card:nth-child(2){--tint:#fff5f3;--accent:#ff7779}.card:nth-child(3){--tint:#f0faf6;--accent:#48c2a0}.card:nth-child(4){--tint:#f7f3ff;--accent:#a078f4}.card:nth-child(5){--tint:#fff8ee;--accent:#ffa23c}.thumb{width:34%;max-width:148px;aspect-ratio:1.52;object-fit:cover;border-radius:10px;background:#f1f3f6;flex:none}.card-copy{min-width:0;flex:1;align-self:center}.headline{display:flex;align-items:center;gap:8px;margin-bottom:5px}.number{display:inline-grid;place-items:center;min-width:29px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:white;font-size:10px;font-weight:800;letter-spacing:.1px}.card-title{font-size:13px;line-height:1.35;font-weight:800;letter-spacing:-.35px;overflow-wrap:anywhere}.card-desc{font-size:10px;line-height:1.45;color:#7b8ba0;letter-spacing:-.2px}.arrow{display:grid;place-items:center;width:27px;height:27px;flex:none;border-radius:50%;background:rgba(255,255,255,.62);color:var(--accent);font-size:20px;line-height:1}.footer{margin-top:20px;padding:13px 0 3px;border-top:1px solid #eef1f6;text-align:center}.footer-label{font-size:10px;color:#8794a7;margin-bottom:10px}.socials{display:flex;justify-content:center;gap:27px}.social{display:flex;flex-direction:column;align-items:center;gap:4px;color:#65758a;font-size:9px}.social-icon{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#f4f6f9;border:1px solid #e8edf3}.social svg{width:16px;height:16px}.social.youtube .social-icon{color:#e62117}.social.instagram .social-icon{color:#c13584}.social.tiktok .social-icon{color:#111111}.bottom-note{margin-top:14px;color:#a3adba;font-size:9px;text-align:center}.empty{display:none;padding:28px 8px;text-align:center;color:#7f8da1;font-size:12px}
@media(min-width:600px){body{padding:24px 0}.page{border:1px solid #edf0f5;border-radius:24px;overflow:hidden}.thumb{max-width:138px}.card{min-height:100px;padding:10px}.card-title{font-size:14px}.card-desc{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="page">
  <div class="disclosure" aria-label="제휴 링크 안내">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4z"/><path d="M17 9a4 4 0 0 1 0 6M19 5a9 9 0 0 1 0 14"/></svg>
    <span>본 페이지에는 제휴 링크가 포함되어 있으며, 이에 따른 일정액의 수수료를 제공받습니다.</span>
  </div>
  <header class="profile">
    <img class="avatar" src="npick-profile.png" alt="N픽 프로필">
    <div class="identity"><div class="brand">N픽</div><div class="tagline">필요한 순간, 알아두면 좋은 선택</div></div>
    <button class="share" id="shareButton" type="button" aria-label="페이지 공유하기">
      <span class="share-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 10.6 6.6-4.2M8.7 13.4l6.6 4.2"/></svg></span><small>공유하기</small>
    </button>
  </header>
  <label class="search" aria-label="추천 리스트 검색">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.2 4.2"/></svg>
    <input id="searchInput" type="search" placeholder="정보를 검색해보세요 (예: 1-1, 이사, 숙소)" autocomplete="off">
  </label>
  <section id="productSearchResults" class="cards" style="display:none;margin-top:10px" aria-live="polite" aria-label="상품 검색 결과"></section>
  <h1 class="section-title" id="sectionTitle"><svg class="leaf" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.8 20.5C5.6 19.9 2.7 15.1 3.1 8.2c4.8.1 8.4 2.3 9.1 7.2.9-5.4 4.3-8.7 9.1-9.1.2 7.8-2.6 13.2-9.5 14.2z"/></svg> N픽 추천 리스트</h1>
  <section class="cards" id="cards">
    <a class="card" href="page1.html" data-search="생활 속 유용한 정보 혜택 서비스 신청 예약 모아보기 정보 1-1">
      <img class="thumb" src="info.jpg" alt="노트와 커피가 놓인 책상" loading="lazy"><div class="card-copy"><div class="headline"><span class="number">01</span><span class="card-title">생활 속 유용한 정보</span></div><div class="card-desc">혜택 · 서비스 · 신청 · 예약 모아보기</div></div><span class="arrow" aria-hidden="true">›</span>
    </a>
    <a class="card" href="npick_recommended_stays.html" data-search="추천 숙소 여행에 맞는 숙소 찾기 호텔 여행 2-1 21 호텔형 카라반 쿠팡 트립닷컴 2-2 2-3 2-4">
      <img class="thumb" src="hotel.jpg" alt="바다가 보이는 숙소" loading="lazy"><div class="card-copy"><div class="headline"><span class="number">02</span><span class="card-title">추천 숙소</span></div><div class="card-desc">여행에 맞는 숙소 찾기</div></div><span class="arrow" aria-hidden="true">›</span>
    </a>
    <a class="card" href="page3.html" data-search="어린이집 첫 입소 준비물 리스트 육아 준비물 체크리스트 준비물 3-1">
      <img class="thumb" src="childcare.jpg" alt="어린이집 입소 준비물" loading="lazy"><div class="card-copy"><div class="headline"><span class="number">03</span><span class="card-title">어린이집 첫 입소 준비물 리스트</span></div><div class="card-desc">처음이라면 미리 체크하기</div></div><span class="arrow" aria-hidden="true">›</span>
    </a>
    <a class="card" href="page4.html" data-search="답례품 고민 여기서 해결 상황별 답례품 선물 4-1">
      <img class="thumb" src="gift.jpg" alt="꽃과 함께 포장된 답례 선물" loading="lazy"><div class="card-copy"><div class="headline"><span class="number">04</span><span class="card-title">답례품 고민 여기서 해결</span></div><div class="card-desc">상황별 답례품 추천</div></div><span class="arrow" aria-hidden="true">›</span>
    </a>
    <a class="card" href="page5.html" data-search="마음을 전하는 선물 모음 명절 선물 부모님 감사 선물 5-1">
      <img class="thumb" src="holiday-gift.jpg" alt="정성스럽게 포장한 선물 세트" loading="lazy"><div class="card-copy"><div class="headline"><span class="number">05</span><span class="card-title">마음을 전하는 선물 모음</span></div><div class="card-desc">명절 선물부터 감사 선물까지</div></div><span class="arrow" aria-hidden="true">›</span>
    </a>
  </section>
  <div class="empty" id="emptyMessage">검색 결과가 없습니다.</div>
  <footer class="footer">
    <nav class="socials" aria-label="SNS 링크">
      <a class="social youtube" href="https://www.youtube.com/@npick_official" target="_blank" rel="noopener noreferrer" aria-label="유튜브"><span class="social-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.2 3.6-6.2 3.6Z"/></svg></span><span>유튜브</span></a>
      <!-- 인스타그램 주소를 실제 N픽 계정 주소로 바꿔주세요. -->
      <a class="social instagram" href="https://www.instagram.com/npick.kr/" target="_blank" rel="noopener noreferrer" aria-label="인스타그램"><span class="social-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor" stroke="none"/></svg></span><span>인스타그램</span></a>
      <!-- N픽 틱톡 계정 -->
      <a class="social tiktok" href="https://www.tiktok.com/@npick.kr" target="_blank" rel="noopener noreferrer" aria-label="틱톡"><span class="social-icon"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.6 7.1a6.7 6.7 0 0 1-4.1-1.4v8.1a6.1 6.1 0 1 1-5.3-6.1v3.2a2.9 2.9 0 1 0 2.1 2.8V2.5h3.2c.2 1.8 1.5 3.4 3.3 3.8.3.1.5.1.8.1v.7Z"/></svg></span><span>틱톡</span></a>
    </nav>
  </footer>
</main>
<script src="product-data.js"></script>
<script>
const searchInput=document.getElementById('searchInput');
const cards=[...document.querySelectorAll('#cards .card')];
const emptyMessage=document.getElementById('emptyMessage');
const productSearchResults=document.getElementById('productSearchResults');
const sectionTitle=document.getElementById('sectionTitle');
const usefulInfoProducts = window.NPICK_PRODUCTS.page1Products;
const stayProducts = window.NPICK_PRODUCTS.stayProducts;
const allProducts = window.NPICK_PRODUCTS.allProducts;
function normalizeSearch(value){return (value||'').toLocaleLowerCase('ko-KR').replace(/[^a-z0-9가-힣]/g,'')}
function renderProductResults(products){
  productSearchResults.replaceChildren();
  products.forEach(product=>{
    const link=document.createElement('a');
    link.className='card'; link.href=product.url; link.target='_blank'; link.rel='sponsored noopener noreferrer';
    const img=document.createElement('img'); img.className='thumb'; img.src=product.image; img.alt=product.alt; img.loading='lazy';
    const copy=document.createElement('div'); copy.className='card-copy';
    const title=document.createElement('div'); title.className='card-title'; title.textContent=product.number+' '+product.title+(product.partner?' ('+product.partner+')':'');
    if(product.description){const desc=document.createElement('div'); desc.className='card-desc'; desc.textContent=product.description; copy.append(title,desc);} else {copy.append(title);}
    const arrow=document.createElement('span'); arrow.className='arrow'; arrow.textContent='›'; arrow.setAttribute('aria-hidden','true');
    link.append(img,copy,arrow); productSearchResults.append(link);
  });
  productSearchResults.style.display=products.length?'grid':'none';
}
function updateSearch(){
  const raw=searchInput.value.trim();
  const q=normalizeSearch(raw);
  // 번호만 입력하면(예: 1, 1-) 같은 번호의 카테고리 카드만 표시합니다.
  // 숙소 번호는 2-1, 2-2처럼 상품 단위로 검색합니다.
  // 숫자만 입력하거나 1-/3-/4-처럼 하이픈만 붙인 경우는 해당 카테고리 카드만 표시합니다.
  // 숙소는 '2'만 입력하면 카테고리 카드, '2-'는 숙소 상품 전체, '2-3'은 해당 상품만 표시합니다.
  const categoryMatch = raw.match(/^(\d+)-?$/);
  const categoryNumber = categoryMatch ? categoryMatch[1] : '';
  const isStayGroupSearch = raw === '2-';
  const isCategoryOnly = !!categoryMatch && !isStayGroupSearch;
  const searchableProducts = allProducts;
  const matchedProducts = raw && !isCategoryOnly
    ? searchableProducts.filter(product => {
        const productNumber = String(product.number || '').trim();
        if (isStayGroupSearch) return productNumber.startsWith('2-');
        return normalizeSearch([product.number,product.title,product.partner].join(' ')).includes(q);
      })
    : [];
  const isProductSearch = matchedProducts.length > 0;
  renderProductResults(matchedProducts);
  sectionTitle.style.display = (isProductSearch || isCategoryOnly) ? 'none' : 'flex';
  let shown=0;
  cards.forEach(card=>{
    const searchable=normalizeSearch((card.dataset.search||'')+' '+card.innerText);
    let match;
    if (!raw) match = true;
    else if (isCategoryOnly) {
      const href = (card.getAttribute('href') || '').toLowerCase();
      const categoryByHref = href === 'page1.html' ? '1'
        : href === 'npick_recommended_stays.html' ? '2'
        : href === 'page3.html' ? '3'
        : href === 'page4.html' ? '4'
        : href === 'page5.html' ? '5' : '';
      match = categoryByHref === categoryNumber;
    } else {
      match = !isProductSearch && searchable.includes(q);
    }
    card.style.display=match?'flex':'none';
    if(match) shown++;
  });
  emptyMessage.style.display=(shown||matchedProducts.length)?'none':'block';
  emptyMessage.textContent='검색 결과가 없습니다.';
}
searchInput.addEventListener('input',updateSearch);
// 기존 URL에 검색어가 들어온 경우에도 화면에 결과를 즉시 표시합니다.
const initialQuery=new URLSearchParams(window.location.search).get('q');
if(initialQuery){searchInput.value=initialQuery;updateSearch();}
document.getElementById('shareButton').addEventListener('click',async()=>{const data={title:document.title,text:'N픽 | 필요한 순간, 알아두면 좋은 선택',url:location.href};try{if(navigator.share){await navigator.share(data)}else if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(location.href);alert('페이지 주소를 복사했어요.')}else{window.prompt('페이지 주소를 복사하세요:',location.href)}}catch(e){if(e.name!=='AbortError')window.prompt('페이지 주소를 복사하세요:',location.href)}});
</script>
</body>
</html>
