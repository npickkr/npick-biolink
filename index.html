<script src="./product-data.js"></script>
<script>
const searchInput = document.getElementById('searchInput');
const cards = [...document.querySelectorAll('#cards .card')];
const emptyMessage = document.getElementById('emptyMessage');
const productSearchResults = document.getElementById('productSearchResults');
const sectionTitle = document.getElementById('sectionTitle');
const productDataMessage = document.getElementById('productDataMessage');
const hasProductData = Array.isArray(window.NPICK_PRODUCTS?.allProducts);
const allProducts = hasProductData
  ? window.NPICK_PRODUCTS.allProducts.filter(product => product && typeof product === 'object')
  : [];

function normalizeSearch(value) {
  return String(value ?? '').toLowerCase().replace(/[^a-z0-9가-힣]/g, '');
}

function renderProductResults(products) {
  productSearchResults.replaceChildren();
  products.forEach(product => {
    const link = document.createElement('a');
    link.className = 'card';
    link.href = product.url;
    link.target = '_blank';
    link.rel = 'sponsored noopener noreferrer';

    const img = document.createElement('img');
    img.className = 'thumb';
    img.src = product.image;
    img.alt = product.alt || '';
    img.loading = 'lazy';

    const copy = document.createElement('div');
    copy.className = 'card-copy';

    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = [product.number, product.title].filter(value => value != null && value !== '').join(' ') + (product.partner ? ' (' + product.partner + ')' : '');
    copy.append(title);

    if (product.guide) {
      const guideEl = document.createElement('div');
      guideEl.className = 'card-guide';
      guideEl.textContent = product.guide;
      copy.append(guideEl);
    }

    if (product.description) {
      const desc = document.createElement('div');
      desc.className = 'card-desc';
      desc.textContent = product.description;
      copy.append(desc);
    }

    const arrow = document.createElement('span');
    arrow.className = 'arrow';
    arrow.textContent = '›';
    arrow.setAttribute('aria-hidden', 'true');

    link.append(img, copy, arrow);
    productSearchResults.append(link);
  });
  productSearchResults.style.display = products.length ? 'grid' : 'none';
}

function updateSearch() {
  const raw = searchInput.value.trim();
  const q = normalizeSearch(raw);
  productDataMessage.hidden = true;

  const categoryMatch = raw.match(/^(\d+)-?$/);
  const categoryNumber = categoryMatch ? categoryMatch[1] : '';

  const matchedProducts = q
    ? allProducts.filter(product => {
        const prodNum = normalizeSearch(product.number);
        const prodTitle = normalizeSearch(product.title);
        const prodPartner = normalizeSearch(product.partner);
        const prodGuide = normalizeSearch(product.guide);
        if (categoryNumber) {
          return String(product.number ?? '').trim().split('-')[0] === categoryNumber;
        }
        if (/^\d+-\d+$/.test(raw)) {
          return prodNum === q;
        }
        return prodNum.includes(q) || prodTitle.includes(q) || prodPartner.includes(q)
          || prodGuide.includes(q) || normalizeSearch(product.description).includes(q);
      })
    : [];

  renderProductResults(matchedProducts);

  let shown = 0;
  cards.forEach(card => {
    const searchable = normalizeSearch((card.dataset.search || '') + ' ' + card.innerText);
    let match = false;

    if (!raw) {
      match = true;
    } else if (categoryNumber) {
      const href = (card.getAttribute('href') || '').toLowerCase();
      const categoryByHref = href.includes('page1') ? '1'
        : href.includes('stay') ? '2'
        : href.includes('page3') ? '3'
        : href.includes('page4') ? '4'
        : href.includes('page5') ? '5'
        : href.includes('page6') ? '6'
        : href.includes('page7') ? '7' : '';
      match = categoryByHref === categoryNumber;
    } else {
      match = searchable.includes(q);
    }

    card.style.display = match ? 'flex' : 'none';
    if (match) shown++;
  });

  sectionTitle.style.display = (!shown) ? 'none' : 'flex';
  emptyMessage.style.display = (shown || matchedProducts.length) ? 'none' : 'block';
}

searchInput.addEventListener('input', updateSearch);

const initialQuery = new URLSearchParams(window.location.search).get('q');
if (initialQuery) {
  searchInput.value = initialQuery;
  updateSearch();
}

document.getElementById('shareButton').addEventListener('click', async () => {
  const shareData = { title: document.title, url: window.location.href };
  if (navigator.share) {
    try {
      await navigator.share(shareData);
      return;
    } catch (error) {
      if (error.name === 'AbortError') return;
    }
  }
  try {
    if (!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');
    await navigator.clipboard.writeText(shareData.url);
    window.alert('페이지 주소를 복사했습니다.');
  } catch {
    window.prompt('아래 페이지 주소를 복사해 주세요.', shareData.url);
  }
});
</script>
